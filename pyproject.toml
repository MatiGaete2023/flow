[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nurus"
dynamic = ["version"]
description = "CSMP personal: Excel, proyectos Word y borradores desde un trabajo compartido"
requires-python = ">=3.12,<3.15"
dependencies = ["pandas>=2.2,<3", "openpyxl>=3.1,<4", "python-docx>=1.1,<2", "lxml>=4.9,<7", "docxcompose>=2.2,<3", "customtkinter>=5.2.2,<6"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "jsonschema>=4,<5", "Pillow>=10,<13", "reportlab>=4.4,<5", "icalendar>=6,<7", "pywinauto>=0.6.9,<1; platform_system == 'Windows'"]
excel-legacy = ["xlrd>=2.0.1"]
excel-native = ["pywin32>=306; platform_system == 'Windows'"]
outlook = ["pywin32>=306; platform_system == 'Windows'"]

[project.scripts]
nurus = "nurus.personal.app:main"
csmp-assistant = "nurus.personal.app:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.dynamic]
version = {attr = "nurus.__version__"}

[tool.setuptools.package-data]
"nurus.rus" = ["*.json"]
"nurus.services" = ["*.json"]
"nurus.personal" = ["*.json", "matrix_patches/*.b64", "plantillas_word/*/*.docx"]

[tool.ruff]
line-length = 120
extend-exclude = ["src/nurus/personal/motor"]

[tool.ruff.format]
# Conserva comillas: varias pruebas y contratos leen el código como texto.
quote-style = "preserve"
