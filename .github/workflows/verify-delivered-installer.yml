name: Verificar instalador entregado
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Run que produjo el instalador a verificar
        required: true
        type: string
      source_commit:
        description: SHA completo del código de ese instalador
        required: true
        type: string
      artifact_name:
        description: Nombre del artefacto del instalador (CSMP-Instalador-Windows-<versión del Asistente>)
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: installer-artifact
      - name: Verificar la entrega elegida con el mismo control del build
        shell: pwsh
        env:
          EXPECTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          . ./tools/verify_installer.ps1
          $installers = @(Get-ChildItem installer-artifact -Recurse -File -Filter Instalar_CSMP_*_Windows.exe)
          if ($installers.Count -ne 1) { throw 'Se requiere un instalador único' }
          Invoke-InstallerVerification -Installer $installers[0].FullName -ExpectedSourceCommit $env:EXPECTED_SOURCE_COMMIT -Destination (Join-Path $env:RUNNER_TEMP 'CSMP entrega verificada') -EvidenceDirectory artifacts
      - name: Evidencia de verificación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 14
          name: CSMP-Delivered-Installer-Verification
          path: artifacts/
          if-no-files-found: ignore
