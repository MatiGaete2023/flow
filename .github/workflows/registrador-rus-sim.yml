name: Registrador RUS - pruebas ficticias
on:
  push:
    branches: ['feat/registrador-observaciones-rus-v3']
    paths:
      - 'registrador_rus/**'
      - '.github/workflows/registrador-rus-sim.yml'
permissions:
  contents: read
concurrency:
  group: registrador-rus-sim
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Dependencias bloqueadas de Flow
        run: python -m pip install --require-hashes -r requirements/linux-py312.lock
      - name: Suite del registrador exclusivamente ficticia
        run: xvfb-run -a python -m unittest discover -s registrador_rus/tests -p 'test_*.py' -v
