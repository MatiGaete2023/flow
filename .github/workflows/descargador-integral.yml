name: Descargador integral y bitácoras
on:
  push:
    branches: ['feat/**', main]
  pull_request:
  workflow_dispatch:

# Push y PR de la misma rama no deben lanzar dos compilaciones simultáneas.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  descargador:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: descargador
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r ../requirements/windows-py312.lock
      - name: Inventario de dependencias bloqueadas
        run: python ../tools/flow_dependency_inventory.py --lock ../requirements/windows-py312.lock --output artifacts/dependencies.json
      - run: python -m pytest -q -p no:cacheprovider
      - run: node test_bitacoras_extension.cjs
      - name: Extensión y servidor ficticios
        run: |
          python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Falló Chromium de pruebas' }
          python verificar_bitacoras_extension.py
          if ($LASTEXITCODE -ne 0) { throw 'Falló la lectura ficticia desde la extensión' }
          python verificar_pdf_extension.py
          if ($LASTEXITCODE -ne 0) { throw 'Falló la evidencia PDF con extensión real' }
      - name: Ejecutable y contrato compartido
        run: |
          python ../tools/write_build_meta.py --descargador .
          if ($LASTEXITCODE -ne 0) { throw 'Falló la identificación del paquete' }
          python -m PyInstaller --noconfirm SITFA_Descargador.spec
          if ($LASTEXITCODE -ne 0) { throw 'Falló el empaquetado' }
          . ../tools/windows_process_check.ps1
          Invoke-CheckedProcess -FilePath (Resolve-Path dist/SITFA_Descargador/SITFA_Descargador.exe).Path -Arguments @('--verificar-paquete','artifacts/package-check.json') -Label 'EXE Descargador'
          $proof = Get-Content artifacts/package-check.json -Raw | ConvertFrom-Json
          if (-not $proof.ok -or -not $proof.bitacora_button_verified -or -not $proof.shared_bitacora_parser_verified -or -not $proof.capture_v1_verified) { throw 'Paquete incompleto' }
      - uses: actions/upload-artifact@v4
        with:
          name: Descargador-SITFA-2.7.2-Windows
          path: |
            descargador/dist/SITFA_Descargador/
            descargador/artifacts/dependencies.json
          if-no-files-found: error
