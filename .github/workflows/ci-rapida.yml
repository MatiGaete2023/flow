name: CI rápida Linux
on:
  push:
    branches: ['feat/**', main]
  pull_request:
    branches: ['feat/**', main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  verificar:
    # El PR permanente de feat a main ya tiene el control del push del mismo SHA.
    if: github.event_name != 'pull_request' || github.base_ref != 'main' || !startsWith(github.head_ref, 'feat/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/linux-py312.lock
      - name: Privacidad, estado y enlaces antes de instalar
        run: |
          python tools/check_real_ids.py
          python tools/estado.py validar
          python tools/check_links.py
      - name: Determinar alcance sin omitir cambios desconocidos
        id: alcance
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            git ls-files > "$RUNNER_TEMP/archivos-ci.txt"
          else
            git diff --name-only "$BASE_SHA" HEAD > "$RUNNER_TEMP/archivos-ci.txt"
          fi
          python - <<'PYCODE'
          import os
          from pathlib import Path
          names = Path(os.environ['RUNNER_TEMP'], 'archivos-ci.txt').read_text().splitlines()
          code = any(not (n.startswith('docs/') or n.endswith('.md')) for n in names)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"codigo={str(code).lower()}\n")
          PYCODE
      - name: Instalar dependencias bloqueadas
        if: steps.alcance.outputs.codigo == 'true'
        run: |
          python -m pip install --require-hashes -r requirements/linux-py312.lock
          python -m pip install --no-deps --no-build-isolation .
          python -m pip check
          python tools/flow_dependency_inventory.py --lock requirements/linux-py312.lock --output artifacts/dependencies.json
      - name: Código y ambas suites sintéticas
        if: steps.alcance.outputs.codigo == 'true'
        run: |
          python -m ruff check --select E9,F63,F7,F82,F401,F841 src descargador tools --extend-exclude src/nurus/personal/motor
          python -m ruff format --check src descargador tools tests
          xvfb-run -a python -m pytest -q tests
          xvfb-run -a python -m pytest -q descargador
          node descargador/test_bitacoras_extension.cjs
