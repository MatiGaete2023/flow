name: Flow en Rust

on:
  push:
    branches: ["rust/**", "feat/flow-estudio-d-20261117"]
    paths: ["rust/**", ".github/workflows/rust.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Dependencias de sistema para la ventana
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libgtk-3-dev xvfb xdotool libgl1-mesa-dri
      - name: Identidades y contactos (solo datos ficticios)
        working-directory: .
        run: python3 tools/check_real_ids.py rust && python3 tools/check_contactos.py rust
      - run: cargo test --workspace --locked
      - name: Compilar y capturar la interfaz con datos ficticios
        run: |
          cargo build --locked -p flow
          xvfb-run -a -s "-screen 0 2200x1400x24" env LIBGL_ALWAYS_SOFTWARE=1 python3 pruebas/ui_evidencia.py --exe target/debug/flow --salida evidencia-ui --completa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Flow_UI_Sintetica_Linux
          path: rust/evidencia-ui/
          retention-days: 14
      - name: Contrato del anonimizador con Python
        run: python3 pruebas/anonimo_contrato.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar Chromium para pruebas ficticias
        working-directory: rust/pruebas
        run: npm ci && npx playwright install --with-deps chromium
      - name: Captura con extensión MV3 y SITFA ficticio
        run: |
          node pruebas/bitacoras_extension.cjs
          node pruebas/calendario_extension.cjs
          node pruebas/historia_extension.cjs
          cargo run --locked -p flow-captura --example probar_captura
          cargo run --locked -p flow-captura --example probar_captura -- --vacia
          cargo run --locked -p flow-captura --example probar_captura -- --lecturas

  windows:
    needs: pruebas
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p flow
      - name: Arranque real del ejecutable Windows (consola, sin SITFA)
        shell: pwsh
        run: |
          & ./target/release/flow.exe ayuda | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "flow.exe no inició correctamente en Windows" }
      - name: Preparar OpenGL de software para el servidor de pruebas
        shell: pwsh
        run: |
          $mesaRoot = Join-Path $env:RUNNER_TEMP 'mesa-flow-d'
          $mesaArchive = Join-Path $env:RUNNER_TEMP 'mesa-flow-d.7z'
          Invoke-WebRequest 'https://github.com/pal1000/mesa-dist-win/releases/download/26.2.7/mesa3d-26.2.7-release-msvc.7z' -OutFile $mesaArchive
          $digest = (Get-FileHash -LiteralPath $mesaArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -ne 'e61153fb1a8e58b9d80b403030cda619eaffbddd9ff99b34163b996ead03d596') { throw 'Huella Mesa inesperada' }
          & 7z l $mesaArchive
          & 7z x $mesaArchive "-o$mesaRoot" -y
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo preparar Mesa' }
          Get-ChildItem -LiteralPath $mesaRoot -Recurse -Force | Select-Object -First 40 FullName
          $mesaLibraries = @(Get-ChildItem -LiteralPath $mesaRoot -Recurse -Force -File -Filter opengl32.dll)
          $mesaLibraries | ForEach-Object { Write-Output $_.FullName }
          $opengl = @($mesaLibraries | Where-Object { $_.Directory.Name -eq 'x64' })
          if ($opengl.Count -ne 1) { throw 'No hay un único runtime OpenGL x64' }
          New-Item -ItemType Directory -Path ui-runtime | Out-Null
          Get-ChildItem -LiteralPath $opengl[0].DirectoryName -Force -File -Filter '*.dll' | Copy-Item -Destination ui-runtime
          Copy-Item -LiteralPath target/release/flow.exe -Destination ui-runtime/flow.exe
          New-Item -ItemType File -Path ui-runtime/flow.exe.local | Out-Null
          if ((Get-FileHash ui-runtime/flow.exe).Hash -ne (Get-FileHash target/release/flow.exe).Hash) { throw 'El binario visual difiere del candidato' }
          Write-Output "Runtime de prueba Mesa 26.2.7 verificado: $digest"
      - name: Capturar interfaz Windows con datos ficticios
        env:
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: python pruebas/ui_evidencia.py --exe ui-runtime/flow.exe --salida evidencia-ui-windows --completa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Flow_UI_Sintetica_Windows
          path: rust/evidencia-ui-windows/
          retention-days: 14
      - name: Preparar carpeta de uso (Flow completo y una copia por herramienta)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path entrega | Out-Null
          # El mismo programa abre solo la herramienta que indica el nombre del .exe.
          foreach ($n in 'flow', 'Flow_Asistente', 'Flow_Descargador', 'Flow_Anonimizador', 'Flow_Meta4') {
            Copy-Item target/release/flow.exe -Destination "entrega/$n.exe"
          }
          Copy-Item LEEME.md, GUIA_PRUEBAS_WINDOWS.md, GUIA_ESTUDIO_D.md, GUIA_ESTUDIO_D.html, ESTUDIO_D_ESTADO.md, REVISION_BITACORAS_ESQUEMA.md -Destination entrega
          Copy-Item qa -Destination entrega/qa -Recurse
          Copy-Item evidencia-ui-windows/Paquete_FICTICIO.zip -Destination entrega
          Copy-Item extension -Destination entrega/extension -Recurse
          @{ commit = $env:GITHUB_SHA; base = 'cfc12ee2af5e4fb5623671fd17ccf7feb9e1cc11'; rama = $env:GITHUB_REF_NAME; run = $env:GITHUB_RUN_ID; plataforma = 'Windows x64'; tipo = 'Candidato para pruebas del usuario'; aceptacion_usuario = 'PENDIENTE'; outlook_sitfa_reales = 'NO EJECUTADOS'; render_ci = 'Mesa aislada, no distribuida' } | ConvertTo-Json | Set-Content entrega/CANDIDATO.json -Encoding utf8
          $entregaRoot = (Resolve-Path entrega).Path
          Get-ChildItem -LiteralPath $entregaRoot -Recurse -File | Sort-Object FullName | ForEach-Object { "$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash)  $([IO.Path]::GetRelativePath($entregaRoot, $_.FullName))" } | Set-Content entrega/SHA256SUMS.txt -Encoding utf8
          Get-Content entrega/CANDIDATO.json
          Get-Content entrega/SHA256SUMS.txt
      - name: Herramientas sueltas para descargar por separado
        shell: pwsh
        run: |
          foreach ($n in 'Asistente', 'Descargador', 'Anonimizador', 'Meta4') {
            New-Item -ItemType Directory -Path "sueltas/$n" | Out-Null
            Copy-Item "entrega/Flow_$n.exe", LEEME.md -Destination "sueltas/$n"
          }
          Copy-Item extension -Destination sueltas/Descargador/extension -Recurse
      - uses: actions/upload-artifact@v4
        with:
          name: Flow_Windows
          path: rust/entrega/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: Flow_Asistente_Windows
          path: rust/sueltas/Asistente/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: Flow_Descargador_Windows
          path: rust/sueltas/Descargador/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: Flow_Anonimizador_Windows
          path: rust/sueltas/Anonimizador/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: Flow_Meta4_Windows
          path: rust/sueltas/Meta4/
          retention-days: 14

  verificacion_plan:
    if: contains(github.event.head_commit.message, '[verificar-wp]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/linux-py312.lock
      - name: Preparar verificación vigente del repositorio
        run: |
          sudo apt-get update && sudo apt-get install -y python3-tk xvfb
          python -m pip install --require-hashes -r requirements/linux-py312.lock
          python -m pip install --no-deps --no-build-isolation .
          python -m pip check
      - name: Ejecutar verificar_wp sin regenerar línea base ni golden
        run: python rust/pruebas/verificar_base_plan.py
      - name: Conservar detalle estructurado del verificador
        if: always()
        run: |
          if [ -f docs/implementacion/verificacion/FLOW_D.json ]; then
            cat docs/implementacion/verificacion/FLOW_D.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Flow_D_Verificacion_Plan
          path: ${{ runner.temp }}/flow-d-verificacion/
          retention-days: 14






