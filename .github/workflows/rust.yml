name: Flow en Rust

on:
  push:
    branches: ["rust/**"]
    paths: ["rust/**", ".github/workflows/rust.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Dependencias de sistema para la ventana
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgtk-3-dev
      - name: Identidades y contactos (solo datos ficticios)
        working-directory: .
        run: python3 tools/check_real_ids.py rust && python3 tools/check_contactos.py rust
      - run: cargo test --workspace --locked
      - name: Contrato del anonimizador con Python
        run: python3 pruebas/anonimo_contrato.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar Chromium para pruebas ficticias
        working-directory: rust/pruebas
        run: npm ci && npx playwright install --with-deps chromium
      - name: Captura con extensión MV3 y SITFA ficticio
        run: |
          node pruebas/bitacoras_extension.cjs
          node pruebas/calendario_extension.cjs
          node pruebas/historia_extension.cjs
          cargo run --locked -p flow-captura --example probar_captura
          cargo run --locked -p flow-captura --example probar_captura -- --vacia
          cargo run --locked -p flow-captura --example probar_captura -- --lecturas

  windows:
    needs: pruebas
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p flow
      - name: Arranque real del ejecutable Windows (consola, sin SITFA)
        shell: pwsh
        run: |
          & ./target/release/flow.exe ayuda | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "flow.exe no inició correctamente en Windows" }
      - name: Preparar carpeta de uso (Flow completo y una copia por herramienta)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path entrega | Out-Null
          # El mismo programa abre solo la herramienta que indica el nombre del .exe.
          foreach ($n in 'flow', 'Flow_Asistente', 'Flow_Descargador', 'Flow_Anonimizador', 'Flow_Meta4') {
            Copy-Item target/release/flow.exe -Destination "entrega/$n.exe"
          }
          Get-ChildItem entrega/*.exe | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)  $($_.Name)" } | Out-File entrega/SHA256SUMS.txt
          Copy-Item LEEME.md, GUIA_PRUEBAS_WINDOWS.md -Destination entrega
          Copy-Item extension -Destination entrega/extension -Recurse
      - name: Herramientas sueltas para descargar por separado
        shell: pwsh
        run: |
          foreach ($n in 'Asistente', 'Descargador', 'Anonimizador', 'Meta4') {
            New-Item -ItemType Directory -Path "sueltas/$n" | Out-Null
            Copy-Item "entrega/Flow_$n.exe", LEEME.md -Destination "sueltas/$n"
          }
          Copy-Item extension -Destination sueltas/Descargador/extension -Recurse
      - uses: actions/upload-artifact@v4
        with:
          name: Flow_Windows
          path: rust/entrega/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: Flow_Asistente_Windows
          path: rust/sueltas/Asistente/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: Flow_Descargador_Windows
          path: rust/sueltas/Descargador/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: Flow_Anonimizador_Windows
          path: rust/sueltas/Anonimizador/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: Flow_Meta4_Windows
          path: rust/sueltas/Meta4/
          retention-days: 14
