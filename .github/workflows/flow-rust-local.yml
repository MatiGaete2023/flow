name: Flow Rust local · Windows

on:
  push:
    # Las ramas de agentes en paralelo (`estudio/agente-*`) también validan; el coordinador las integra a la rama principal.
    branches: [estudio/paridad-python-rust-20261119, 'estudio/agente-**']
    paths: [app/**, tools/**, descargador/**, src/**, tests/**, .github/workflows/flow-rust-local.yml]
  workflow_dispatch:
    inputs:
      entrega:
        description: 'Ejecutable de entrega (--release), capturas y contraste V1 con rust/'
        type: boolean
        default: false

permissions:
  contents: read

# E-V3 · CI por niveles: Linux prueba todo en cada push; Windows compila y prueba, regenera los oráculos solo si
# cambian app/qa/**, app/tests/datos/** o la referencia Python, y deja la entrega, las capturas y el contraste V1 a
# pedido.
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - name: Probar la aplicación (oráculos con datos versionados incluidos)
        run: cargo test --manifest-path app/Cargo.toml --locked --all-targets
      - name: Verificadores estáticos
        run: |
          python3 tools/check_real_ids.py app/src
          python3 tools/check_contactos.py app/src
          python3 tools/verificar_textos_umbrales.py
          python3 tools/inventario_escrituras.py
          python3 tools/verificar_solo_lectura.py --autoprueba
          python3 tools/verificar_solo_lectura.py
          python3 tools/verificar_referencia_python.py

  validar:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detectar cambios de oráculos o de la referencia
        id: cambios
        shell: pwsh
        run: |
          $antes = '${{ github.event.before }}'
          $todo = '${{ github.event_name }}' -ne 'push' -or -not $antes -or $antes -match '^0+$'
          if (-not $todo) {
            git cat-file -e "$antes^{commit}" 2>$null
            if ($LASTEXITCODE -ne 0) { $todo = $true }
          }
          # `lista`: los oráculos a regenerar; «todos» si cambió la referencia Python o no hay commit anterior.
          $lista = 'todos'
          if ($todo) { $oraculos = 'true' } else {
            $archivos = git diff --name-only $antes $env:GITHUB_SHA
            $oraculos = if ($archivos | Where-Object { $_ -match '^(app/qa/|app/tests/datos/|descargador/|src/|tests/)' }) { 'true' } else { 'false' }
            if (-not ($archivos | Where-Object { $_ -match '^(descargador/|src/|tests/)' })) {
              $lista = (($archivos | ForEach-Object { if ($_ -match '^app/qa/generar_(\w+)\.py$' -or $_ -match '^app/tests/datos/(\w+)\.json$') { $Matches[1] } }) | Sort-Object -Unique) -join ','
            }
          }
          "oraculos=$oraculos" | Add-Content -Encoding utf8 $env:GITHUB_OUTPUT
          "lista=$lista" | Add-Content -Encoding utf8 $env:GITHUB_OUTPUT
          "Regenerar oráculos: $oraculos ($lista)"
      - name: Obtener la referencia Flow Python
        uses: actions/checkout@v4
        with:
          ref: afc4d12ae1adabf21049c809c0d0d8f747e2e306
          path: referencia-python-ci
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: referencia-python-ci/requirements/windows-py312.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - name: Comprobar fuentes y ejemplos
        shell: pwsh
        run: |
          python tools/check_real_ids.py app/src
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/check_contactos.py app/src
      - name: Probar la aplicación desde app
        run: cargo test --manifest-path app/Cargo.toml --locked --all-targets
      - name: E-R0 · Meta 4 y Anonimizador reutilizados (sus pruebas con las características de app/)
        shell: pwsh
        run: |
          foreach ($crate in 'flow-meta4', 'flow-anonimo') {
            cargo test --manifest-path rust/Cargo.toml --locked -p $crate --features serde_json/preserve_order
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Comprobar ZIP sintéticos de Python
        shell: pwsh
        run: |
          foreach ($variante in 'completa', 'parcial') {
            cargo run --manifest-path app/Cargo.toml --locked --example verificar_paquete -- "contracts/csmp_capture_v1/fixtures/$variante.zip"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Compilar el ejecutable de Flow Rust
        run: cargo build --manifest-path app/Cargo.toml --locked --bin flow_rust
      - name: Autodiagnóstico del ejecutable (datos sintéticos; el informe es nuevo)
        shell: pwsh
        run: |
          $informe = Join-Path $env:RUNNER_TEMP 'autodiagnostico.json'
          $p = Start-Process app/target/debug/flow_rust.exe -ArgumentList '--self-test', $informe -Wait -PassThru
          Get-Content $informe
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
      - name: Compilar el ejecutable de entrega
        if: inputs.entrega
        shell: pwsh
        run: |
          cargo build --manifest-path app/Cargo.toml --locked --release --bin flow_rust
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $salida = New-Item -ItemType Directory -Force -Path app/target/entrega
          Copy-Item app/target/release/flow_rust.exe $salida
          $huella = (Get-FileHash -LiteralPath (Join-Path $salida 'flow_rust.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          "$huella  flow_rust.exe`ncommit $env:GITHUB_SHA" | Set-Content -Encoding utf8 (Join-Path $salida 'SHA256.txt')
          Get-Content (Join-Path $salida 'SHA256.txt')
          $p = Start-Process (Join-Path $salida 'flow_rust.exe') -ArgumentList '--self-test', (Join-Path $salida 'autodiagnostico.json') -Wait -PassThru
          Get-Content (Join-Path $salida 'autodiagnostico.json')
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
      - name: Ejecutable de prueba (debug) para la prueba corta del usuario
        if: ${{ !inputs.entrega }}
        shell: pwsh
        run: |
          $salida = New-Item -ItemType Directory -Force -Path app/target/entrega
          Copy-Item app/target/debug/flow_rust.exe $salida
          $huella = (Get-FileHash -LiteralPath (Join-Path $salida 'flow_rust.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          "$huella  flow_rust.exe (debug)`ncommit $env:GITHUB_SHA" | Set-Content -Encoding utf8 (Join-Path $salida 'SHA256.txt')
      - uses: actions/upload-artifact@v4
        with:
          name: Flow_Rust_Windows_exe
          path: app/target/entrega/
          if-no-files-found: error
          retention-days: 14
      - name: Contrastar bitácoras V2 con el Descargador Python
        shell: pwsh
        run: |
          git -C referencia-python-ci rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --require-hashes -r referencia-python-ci/requirements/windows-py312.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --manifest-path app/Cargo.toml --locked --example revisar_bitacoras
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python app/qa/contrastar_bitacoras.py app/target/debug/examples/revisar_bitacoras.exe referencia-python-ci
      - name: Abrir en Trabajo un ZIP de contexto producido por Flow Python
        shell: pwsh
        run: |
          $contexto = Join-Path $env:RUNNER_TEMP 'flow-e3-ficticio'
          python app/qa/generar_contexto_e3.py referencia-python-ci $contexto
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:FLOW_E3_PAQUETE = (Resolve-Path (Join-Path $contexto 'contexto-e3.zip')).Path
          "FLOW_E3_PAQUETE=$env:FLOW_E3_PAQUETE" | Add-Content -Encoding utf8 $env:GITHUB_ENV
          $env:FLOW_E3_HISTORIA = (Resolve-Path (Join-Path $contexto 'contexto-e3-historia.zip')).Path
          $env:FLOW_E3_ESPERADO = Join-Path $contexto 'esperado-historia.json'
          python app/qa/esperado_contexto_e3.py $env:FLOW_E3_HISTORIA $env:FLOW_E3_ESPERADO
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "FLOW_E3_HISTORIA=$env:FLOW_E3_HISTORIA" | Add-Content -Encoding utf8 $env:GITHUB_ENV
          "FLOW_E3_ESPERADO=$env:FLOW_E3_ESPERADO" | Add-Content -Encoding utf8 $env:GITHUB_ENV
          cargo test --manifest-path app/Cargo.toml --locked --bin flow_rust contexto_e3_del_exportador_python -- --include-ignored
      - name: Regenerar los oráculos con la referencia Python
        if: steps.cambios.outputs.oraculos == 'true'
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          $lista = '${{ steps.cambios.outputs.lista }}'
          foreach ($o in @('a78', 'lecturas', 'vinculos', 'bitacoras', 'lote', 'paquete', 'excel', 'resultados', 'sync', 'conciliacion', 'personalizacion', 'estadisticas', 'correos', 'ordenes', 'meta4', 'catastro', 'sync_paquete', 'anulaciones')) {
            if ($lista -ne 'todos' -and (($lista -split ',') -notcontains $o)) { continue }
            # a78 lleva ZIP en base64 que cambia byte a byte entre ejecutores: solo se contrasta cuando se pide por nombre.
            if ($o -eq 'a78' -and $lista -eq 'todos') { continue }
            $salida = Join-Path $env:RUNNER_TEMP "$o.json"
            if ($o -eq 'vinculos') {
              python app/qa/generar_vinculos.py
              Copy-Item app/tests/datos/vinculos.json $salida
              git diff --exit-code -- app/tests/datos/vinculos.json
              if ($LASTEXITCODE -ne 0) { Write-Error 'app/tests/datos/vinculos.json no coincide con generar_vinculos.py'; exit 1 }
              continue
            }
            python "app/qa/generar_$o.py" $salida
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python -c "import sys; a=open(sys.argv[1],'rb').read().replace(b'\r\n',b'\n').split(b'\n'); b=open(sys.argv[2],'rb').read().replace(b'\r\n',b'\n').split(b'\n'); d=[i for i in range(max(len(a),len(b))) if (a[i] if i<len(a) else None)!=(b[i] if i<len(b) else None)]; [print('línea',i+1,'| generado:',(a[i] if i<len(a) else b'-')[:160],'| versionado:',(b[i] if i<len(b) else b'-')[:160]) for i in d[:5]]; sys.exit(1 if d else 0)" $salida "app/tests/datos/$o.json"
            if ($LASTEXITCODE -ne 0) { Write-Error "app/tests/datos/$o.json no coincide con generar_$o.py"; exit 1 }
          }
      - name: Probar todas las pruebas con variables
        shell: pwsh
        run: |
          cargo test --manifest-path app/Cargo.toml --locked --bin flow_rust -- --include-ignored --skip exporta_mismo_lote_de_python --skip velocidad_20000
      - name: Contrastar ZIP V1 con el productor nativo histórico
        if: inputs.entrega
        shell: pwsh
        run: |
          $env:FLOW_RUST_REVISAR_V1 = (Resolve-Path 'app/target/debug/examples/revisar_bitacoras.exe').Path
          cargo test --manifest-path rust/Cargo.toml --locked -p flow ventana_completa_de_sitfa_acredita_ausencia_y_activa_el_motor -- --nocapture
      - name: Preparar OpenGL en el runner
        if: inputs.entrega
        shell: pwsh
        run: |
          $mesaRoot = Join-Path $env:RUNNER_TEMP 'mesa-flow-rust'
          $mesaArchive = "$mesaRoot.7z"
          Invoke-WebRequest 'https://github.com/pal1000/mesa-dist-win/releases/download/26.2.7/mesa3d-26.2.7-release-mingw.7z' -OutFile $mesaArchive
          $digest = (Get-FileHash -LiteralPath $mesaArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -ne '19c74aad7b09e682473b8de4c35b47e6498de97b71cae5511a231b8eb02f2b22') { throw 'Huella Mesa inesperada' }
          & 7z x $mesaArchive "-o$mesaRoot" -y
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo preparar Mesa' }
          $opengl = @(Get-ChildItem -LiteralPath $mesaRoot -Recurse -File -Filter opengl32.dll |
            Where-Object { $_.Directory.Name -eq 'x64' })
          if ($opengl.Count -ne 1) { throw 'No hay un único runtime OpenGL x64' }
          Get-ChildItem -LiteralPath $opengl[0].DirectoryName -File -Filter '*.dll' |
            Copy-Item -Destination app/target/debug
          New-Item -ItemType File -Path app/target/debug/flow_rust.exe.local | Out-Null
      - name: Capturar el diseño de Flow Rust
        if: inputs.entrega
        env:
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: python app/qa/capturar_windows.py --exe app/target/debug/flow_rust.exe --salida app/target/capturas
      - uses: actions/upload-artifact@v4
        if: inputs.entrega
        with:
          name: Flow_Rust_Local_Capturas_Windows
          path: app/target/capturas/
          if-no-files-found: error
          retention-days: 14
