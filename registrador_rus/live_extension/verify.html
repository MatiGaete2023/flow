<!doctype html><html lang="es"><meta charset="utf-8"><title>Validar ingreso RUS — sin guardado</title>
<body><h1>Validación local de bitácora</h1><p>Abre el listado correcto y una sola bitácora del ingreso confirmado en Flow. No cierres la ventana emergente.</p>
<p><label for="credentials">Puerto | sesión | token de Flow (solo esta sesión)</label></p>
<input id="credentials" type="password" size="82" autocomplete="off" spellcheck="false">
<button id="run" type="button">Ejecutar validación de Flow</button><p id="status" role="status">Sin conexión. No se guarda ni se envía ninguna observación.</p>
<p id="permission"></p><script src="browser.js"></script><script src="verify.js"></script></body></html>
